spring:
  application:
    name: ibs
  datasource:
    url: jdbc:postgresql://localhost:5432/ibs-web
    username: postgres
    password: ${IBS_DB_PASSWORD:1234}
    hikari:
      # Old app never tuned this (JNDI pool was configured on the WildFly side, outside the repo).
      # Starting conservative; DevOps/whoever owns the DB should revisit under real load.
      maximum-pool-size: ${IBS_DB_POOL_SIZE:10}
      connection-timeout: 30000
  session:
    store-type: redis
  data:
    redis:
      host: ${IBS_REDIS_HOST:localhost}
      port: ${IBS_REDIS_PORT:6379}

mybatis:
  mapper-locations: classpath:mapper/*.xml
  configuration:
    map-underscore-to-camel-case: true

server:
  port: 8080
  servlet:
    # Old app's WAR (rootProject.name = 'ibs', no context-root override) deployed on WildFly at
    # context path /ibs by default — confirmed against the real SIT client, which calls e.g.
    # /ibs/RSA, not /RSA. This one setting reproduces that uniformly for every route (all ~133
    # business adapters plus /login, /security_check, /RSA, /AES, etc.) without touching any
    # controller. NOTE: this also moves the actuator health endpoint to /ibs/actuator/health —
    # worth flagging to whoever wires up the container HEALTHCHECK/readiness probe.
    context-path: /ibs

ibs:
  security:
    # Old app only enforced encryption when set.mode=PRO (a manual per-environment file swap).
    # Same intent, cleaner mechanism: default off locally/in tests, set true via env var in prod.
    encryption-required: ${IBS_ENCRYPTION_REQUIRED:false}
  cbs:
    rsa:
      # CBS's OWN RSA key-exchange endpoint (real login flow) — no real value was ever in this
      # repo, per the old app's per-environment file-swap convention (`rsa.server.address`).
      url: ${IBS_CBS_RSA_URL:http://127.0.0.1:10210/ONLWeb/HttpCsbRsaAdapter}
      terminal-unique-no: ${IBS_CBS_RSA_TERMINAL_UNIQUE_NO:1}
  resource:
    # Externally-reachable base URL embedded in `corporateUserProfileImageURL` sent to CBS on
    # company-logo upload, so CBS can fetch the image back later. Defaults to this app's own
    # /api/images/resources endpoint; override wherever the externally-reachable host/port differs
    # (e.g. behind the /ibs reverse-proxy prefix in SIT/UAT/PROD).
    image-base-url: ${IBS_RESOURCE_IMAGE_BASE_URL:http://127.0.0.1:8080/ibs/api/images/resources}
  download:
    # Base directory /download and /download/{filename} serve files from (old app's BIZMOB_HOME
    # system property). Every resolved path is checked to stay inside this directory — see
    # FileDownloadSbc's security note.
    docs-base-path: ${IBS_DOWNLOAD_DOCS_BASE_PATH:./docs}
  mci:
    # External, non-CBS file-upload service ("MCI") that /upload/docfile proxies to. Unreachable/
    # unverified from this environment, same as CBS and CBS's own RSA endpoint.
    upload-url: ${IBS_MCI_UPLOAD_URL:http://127.0.0.1:9090/mci/upload}

management:
  endpoints:
    web:
      exposure:
        # Old app had no health/readiness concept at all. "health" is enough for a Docker
        # HEALTHCHECK; widen later only if DevOps's monitoring actually wants more (metrics, etc).
        include: health
  endpoint:
    health:
      # Reports DB/Redis reachability individually rather than one opaque UP/DOWN.
      show-details: when-authorized

logging:
  level:
    root: INFO
    # Mirrors the old logback.xml, which force-set bizmob.corpbanking to DEBUG regardless of root.
    kh.bank.dgb.ibs: DEBUG

# Package layout: kh.bank.dgb.ibs.app.<backend>.<feature_name>/ (snake_case feature folders),
# each holding exactly three classes:
#   <Feature>Cbc — controller   <Feature>Sbc — service   <Feature>Rbc — MyBatis mapper interface
# <backend> is one of:
#   local — features backed entirely by this app's own Postgres schema (the 10 DAOs ported in
#           Phase 2: faq, news_event, bbs_board_attach, bbs_board_product, visited_notice,
#           prepare_document, purpose_of_transfer, remark_document, resource_file_info,
#           service_status — plus the account_inquiry worked template).
#   cbs   — features that call out to the core-banking system (Phase 3's 143 adapters). A feature
#           needing both (e.g. a CBS transfer that also writes a local audit row) defaults to cbs,
#           since the CBS call is the primary action.
# Mapper XML stays flat under resources/mapper/<Feature>Rbc.xml (matches aml-web's convention);
# only the Kotlin side is split by backend/feature. See app/local/account_inquiry/ for the worked
# Cbc/Sbc/Rbc template.
